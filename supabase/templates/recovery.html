<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Crea una nueva contraseña</title></head>
<body style="margin:0;background:#f7fbff;font-family:Nunito,Helvetica,Arial,sans-serif;color:#1f2a44">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;padding:28px">
        <tr><td style="font-size:18px;font-weight:700;color:#286eb2;padding-bottom:16px">mercadito.baby</td></tr>
        <tr><td style="font-size:20px;font-weight:700;padding-bottom:8px">Crea una nueva contraseña</td></tr>
        <tr><td style="font-size:15px;line-height:1.5;padding-bottom:20px">Recibimos una solicitud para cambiar la contraseña de tu cuenta. El enlace vence en 1 hora y solo sirve una vez.</td></tr>
        <tr><td style="padding-bottom:16px">
          <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="display:inline-block;background:#ff6f9c;color:#1f2a44;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px">Crear nueva contraseña</a>
        </td></tr>
        <tr><td style="font-size:13px;color:#616a83;line-height:1.5">Si no lo pediste, ignora este correo: tu contraseña no cambia.</td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
